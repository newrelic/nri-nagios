name: Batch release pipeline

on:
  release:
    types:
      - released
    tags:
      - 'v*'


permissions:
  contents: read

jobs:
  release:
    uses: newrelic/coreint-automation/.github/workflows/reusable_on_release_batch.yaml@batch-release-automation
    with:
      tag: ${{ github.event.release.tag_name }}
    secrets: inherit
