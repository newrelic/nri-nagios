name: Prerelease pipeline
on:
  release:
    types:
      - prereleased
    tags:
      - 'v*'


permissions:
  contents: write

jobs:
  pre-release:
    uses: newrelic/coreint-automation/.github/workflows/reusable_pre_release_build.yaml@batch-s3-publish-fix
    with:
      tag: ${{ github.event.release.tag_name }}
      integration: nagios
      upload_fips_packages: true
    secrets: inherit
